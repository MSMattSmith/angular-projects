<div class="place-content-between flex mx-4 md:mx-0">
    <img
        [src]="logoUrl"
        alt=""
        width="70"
        height="114"
        class="flex-none rounded-md max-h-full"
    />
    <h2 class="float-left font-sans text-2xl h-10 font-bold my-auto">
        Costumes
    </h2>
    <div class="flex my-auto">
        <button
            *ngIf="pendingRefresh > 0"
            type="button"
            class="flex max-w-16 text-sm leading-6 font-medium p-0 mr-2 hover:bg-slate-100 rounded-lg cursor-pointer"
            (click)="refreshData()"
        >
            <mat-icon class="m-auto text-4xl">refresh</mat-icon>
            <p class="m-auto w-6 h-6 bg-indigo-600 text-white rounded-full">
                {{ pendingRefresh }}
            </p>
        </button>
        <button
            type="button"
            class="app-button-secondary block lg:hidden text-sm leading-6 py-2 px-3"
            (click)="openFilter.emit()"
        >
            Filter
        </button>
        <button
            type="button"
            class="app-button-secondary text-sm leading-6 py-2 px-3 cursor-pointer mr-2"
            (click)="addBulk.emit()"
        >
            Bulk add
        </button>
        <button
            type="button"
            class="app-button-primary max-w-24 min-w-24 text-sm leading-6 py-2 px-3 cursor-pointer"
            (click)="addNew.emit()"
        >
            Add new
        </button>
    </div>
</div>
