<div class="input-dropdown">
    <div class="w-full svelte-1l8159u">
        <div
            class="p-1 flex border border-gray-200 bg-white rounded svelte-1l8159u"
        >
            <div class="flex flex-auto flex-wrap">
                <div
                    *ngFor="let key of selectedKeys; let index = index"
                    class="flex justify-center items-center m-1 font-medium py-1 px-2 bg-white rounded-full text-teal-700 bg-teal-100 border border-teal-300"
                >
                    <div
                        class="text-xs font-normal leading-none max-w-full flex-initial"
                    >
                        {{ key }}
                    </div>
                    <div
                        class="flex flex-auto flex-row-reverse"
                        (click)="removeSelectedKey(index)"
                    >
                        <div>
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="100%"
                                height="100%"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="feather feather-x cursor-pointer hover:text-teal-400 rounded-full w-4 h-4 ml-2"
                            >
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </div>
                    </div>
                </div>
                <div class="flex-1">
                    <input
                        placeholder=""
                        class="bg-transparent p-1 px-2 appearance-none outline-none h-full w-full text-gray-800"
                        id="input-dropdown"
                        (focus)="opened = true"
                        (blur)="opened = false"
                        [(ngModel)]="searchValue"
                        autocomplete="off"
                    />
                </div>
            </div>
            <div
                class="text-gray-300 w-8 py-1 pl-2 pr-1 border-l flex items-center border-gray-200 svelte-1l8159u"
            >
                <button
                    class="cursor-pointer w-6 h-6 text-gray-600 outline-none focus:outline-none"
                    type="button"
                    (click)="opened = !opened"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="100%"
                        height="100%"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="feather feather-chevron-up w-4 h-4"
                    >
                        <polyline points="18 15 12 9 6 15"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <div
        [hidden]="!opened"
        class="input-dropdown-options absolute shadow top-100 bg-white z-40 w-full lef-0 rounded overflow-y-auto svelte-5uyqqj"
    >
        <div class="flex flex-col w-full">
            <div
                *ngFor="let option of filteredOptions"
                (mousedown)="select(option.key)"
                class="cursor-pointer w-full border-gray-100 rounded-t border-b hover:bg-teal-100"
            >
                <div
                    class="flex w-full items-center p-2 pl-2 border-transparent border-l-2 relative hover:border-teal-100"
                >
                    <div class="w-full items-center flex">
                        <div class="mx-2 leading-6">{{ option.value }}</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
